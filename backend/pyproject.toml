[project]
name = "hanshui-backend"
version = "0.1.0"
description = "汉水智控：AI+水务智慧运营平台（Demo）后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.7.4,<0.8",
    "httpx>=0.28.1",
    "langgraph>=1.0,<2",
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "pillow>=11.3",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "redis>=5.2",
    "reportlab>=4.4,<5",
    "sqlglot>=30.30.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.1.post1",
    "ruff==0.17.4",
]
vision = [
    "onnx>=1.23.2",
    "onnxslim>=0.1.99",
    "ultralytics>=8.4.204",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI 的 Query() 和 frozen dataclass 配置作默认参数是安全的
    "B905",  # zip 的 strict 不强制，长度相等由各处的数据构造保证
]

[tool.ruff.lint.per-file-ignores]
# 这些闭包都在定义它的那次循环内执行完，不会读到后续迭代的变量
"app/analytics/rules.py" = ["B023"]
"evals/rag/run.py" = ["B023"]
"evals/vision/run.py" = ["B023"]
"vision/floatwaste.py" = ["B023"]
